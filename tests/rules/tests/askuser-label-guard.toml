[[case]]
name = "ids-with-space"
rule = "askuser-label-guard"
expect = "quiet"
input = { tool_name = "AskUserQuestion", tool_input = { questions = [{ question = "q", options = [{ label = "A 並列化（推奨）" }, { label = "B 先行起動" }] }] } }

[[case]]
name = "ids-with-punct"
rule = "askuser-label-guard"
expect = "quiet"
input = { tool_name = "AskUserQuestion", tool_input = { questions = [{ question = "q", options = [{ label = "A: 並列化" }, { label = "B+C 両方" }, { label = "C（推奨）" }] }] } }

[[case]]
name = "numbered-ids"
rule = "askuser-label-guard"
expect = "quiet"
input = { tool_name = "AskUserQuestion", tool_input = { questions = [{ question = "q", options = [{ label = "L1 hook" }, { label = "L2 docs" }] }] } }

[[case]]
name = "id-only"
rule = "askuser-label-guard"
expect = "quiet"
input = { tool_name = "AskUserQuestion", tool_input = { questions = [{ question = "q", options = [{ label = "A" }, { label = "B" }] }] } }

[[case]]
name = "no-id"
rule = "askuser-label-guard"
expect = "deny"
contains = "「並列化」「先行起動」"
input = { tool_name = "AskUserQuestion", tool_input = { questions = [{ question = "q", options = [{ label = "並列化" }, { label = "先行起動" }] }] } }

[[case]]
name = "partly-missing"
rule = "askuser-label-guard"
expect = "deny"
input = { tool_name = "AskUserQuestion", tool_input = { questions = [{ question = "q", options = [{ label = "A 並列化" }, { label = "先行起動" }] }] } }

[[case]]
name = "word-start"
rule = "askuser-label-guard"
expect = "deny"
input = { tool_name = "AskUserQuestion", tool_input = { questions = [{ question = "q", options = [{ label = "Apply" }, { label = "Both" }] }] } }

[[case]]
name = "lowercase"
rule = "askuser-label-guard"
expect = "deny"
input = { tool_name = "AskUserQuestion", tool_input = { questions = [{ question = "q", options = [{ label = "a 並列化" }, { label = "b 先行起動" }] }] } }

# A description is not shown in a question that has previews.
[[case]]
name = "description-beside-preview"
rule = "askuser-label-guard"
expect = "deny"
contains = "description のある選択肢: 「A 案」"
input = { tool_name = "AskUserQuestion", tool_input = { questions = [{ question = "q", options = [{ label = "A 案", description = "読まれない", preview = "p" }, { label = "B 案", description = "" }] }] } }

[[case]]
name = "description-without-preview"
rule = "askuser-label-guard"
expect = "quiet"
input = { tool_name = "AskUserQuestion", tool_input = { questions = [{ question = "q", options = [{ label = "A 案", description = "見える" }, { label = "B 案", description = "見える" }] }] } }

[[case]]
name = "preview-without-description"
rule = "askuser-label-guard"
expect = "quiet"
input = { tool_name = "AskUserQuestion", tool_input = { questions = [{ question = "q", options = [{ label = "A 案", description = "", preview = "p" }, { label = "B 案", description = "", preview = "q" }] }] } }

# Each question is judged by its own previews.
[[case]]
name = "preview-in-another-question"
rule = "askuser-label-guard"
expect = "quiet"
input = { tool_name = "AskUserQuestion", tool_input = { questions = [{ question = "q1", options = [{ label = "A 案", description = "見える" }] }, { question = "q2", options = [{ label = "B 案", description = "", preview = "p" }] }] } }
