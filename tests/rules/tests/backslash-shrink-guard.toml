# Which inline-script commands were stopped once, kept apart from the real ones.
[setup]
env = { BACKSLASH_GUARD_STATE_DIR = "{root}/backslash-state" }

[[case]]
name = "heredoc-python"
rule = "backslash-shrink-guard"
expect = "deny"
command = '''python - <<'EOF'
print("CR は \\r\\n")
EOF'''

[[case]]
name = "heredoc-unquoted-word"
rule = "backslash-shrink-guard"
expect = "deny"
command = '''cat <<EOF > a.txt
C:\\Users
EOF'''

[[case]]
name = "heredoc-dash"
rule = "backslash-shrink-guard"
expect = "deny"
command = "cat <<-END\n\ta\\\\b\n\tEND"

[[case]]
name = "single-quote"
rule = "backslash-shrink-guard"
expect = "deny"
command = '''printf '%s\n' 'a\\b' '''

[[case]]
name = "ansi-c"
rule = "backslash-shrink-guard"
expect = "deny"
command = '''echo $'a\\b' '''

[[case]]
name = "double-quote"
rule = "backslash-shrink-guard"
expect = "context"
command = '''grep -n "a\\.b" file.txt'''

[[case]]
name = "bare"
rule = "backslash-shrink-guard"
expect = "context"
command = '''echo a\\b'''

[[case]]
name = "after-heredoc"
rule = "backslash-shrink-guard"
expect = "context"
command = '''cat <<'EOF'
plain
EOF
grep "x\\.y" f'''

[[case]]
name = "no-backslash"
rule = "backslash-shrink-guard"
expect = "quiet"
command = "ls -la /c/Main"

[[case]]
name = "single-backslash"
rule = "backslash-shrink-guard"
expect = "quiet"
command = '''printf '%s\n' 'a\b' "C:\Main"'''

[[case]]
name = "heredoc-single-backslash"
rule = "backslash-shrink-guard"
expect = "quiet"
command = '''python - <<'EOF'
print("a\nb")
EOF'''

[[case]]
name = "single-quote-in-double"
rule = "backslash-shrink-guard"
expect = "quiet"
command = '''echo "it's \"ok\""'''

[[case]]
name = "double-quote-before-dollar"
rule = "backslash-shrink-guard"
expect = "deny"
command = '''reg query "HKLM\\$k\\{x}"'''

[[case]]
name = "double-quote-before-backtick"
rule = "backslash-shrink-guard"
expect = "deny"
command = '''echo "a\\`date`"'''

[[case]]
name = "double-quote-before-closing-quote"
rule = "backslash-shrink-guard"
expect = "deny"
command = '''echo "C:\\" next'''

[[case]]
name = "double-quote-before-brace"
rule = "backslash-shrink-guard"
expect = "context"
command = '''echo "C:\\{x}"'''

# A script handed over inline reads one backslash where two were written:
# stopped the first time, reminded when the same command is sent again.
[[case]]
name = "inline-node"
rule = "backslash-shrink-guard"
expect = "deny"
contains = "インラインのスクリプト"
command = '''node -e "console.log('a\\nb')"'''

[[case]]
name = "inline-node-again"
rule = "backslash-shrink-guard"
expect = "context"
command = '''node -e "console.log('a\\nb')"'''

[[case]]
name = "inline-sed"
rule = "backslash-shrink-guard"
expect = "deny"
command = '''sed -i "s/a/\\\\n/" f'''

[[case]]
name = "inline-python"
rule = "backslash-shrink-guard"
expect = "deny"
command = '''python -c "print('\\t')"'''

[[case]]
name = "inline-other-session"
rule = "backslash-shrink-guard"
expect = "deny"
command = '''node -e "console.log('a\\nb')"'''
input = { session_id = "other" }
