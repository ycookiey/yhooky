# When the video cannot be shown, it is sent as it is.
[setup]
env = { YSIDEPANEY_BIN = "{root_win}/post.cmd", EXPLORER_BIN = "{root_win}/no-such-explorer.cmd" }
files = { "post.cmd" = "@exit /b 0\r\n", "clip.mp4" = "" }

[[case]]
name = "no-explorer"
rule = "sendfile-to-ysidepaney"
expect = "quiet"
input = { tool_name = "SendUserFile", tool_input = { files = ["clip.mp4"] } }

[[case]]
name = "no-explorer-beside-image"
rule = "sendfile-to-ysidepaney"
expect = "deny"
contains = "残り(clip.mp4)"
input = { tool_name = "SendUserFile", tool_input = { files = ["a.png", "clip.mp4"] } }
